name: check

# Manual only for now: CI costs money and slows fast iteration. Restore push and pull_request to run it again.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Selftest
        run: scripts/selftest
      - name: Validate the plugin manifests
        run: npx -y @anthropic-ai/claude-code@2.1.302 plugin validate . --strict
      - name: Parse every JSON manifest
        run: for f in .claude-plugin/*.json .codex-plugin/plugin.json .agents/plugins/marketplace.json hooks/hooks.json; do python3 -m json.tool "$f" >/dev/null || exit 1; done
